name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy bot --ignore-missing-imports
      - run: pytest -q
      - name: pip-audit (resolved dependencies)
        run: python -m pip install --upgrade pip pip-audit && pip-audit --skip-editable
