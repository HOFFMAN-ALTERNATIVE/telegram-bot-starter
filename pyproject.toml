[project]
name = "telegram-bot-starter"
version = "0.1.0"
description = "Modern async Telegram bot template: aiogram 3, pydantic-settings, optional local LLM via Ollama"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiogram>=3.13,<4",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
